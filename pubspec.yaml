name: iot_achocalla
description: "Sistema Inteligente IoT - Gestión Energía, Agua y Gas - Achocalla Bolivia"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_database: ^11.1.4
  firebase_messaging: ^15.1.3

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.3.0

  # UI & Charts
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3

  # HTTP & MQTT
  http: ^1.2.2
  mqtt_client: ^10.2.1

  # Local Storage
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # WebView (solo para Android/iOS)
  webview_flutter: ^4.10.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/3d/